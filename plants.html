      body {

      .floating-navbar {
      position: fixed;
      top: 10px;
      left: 5px;
      /*width: 90%;

      z-index: 1000;
      
      /* Flexbox positioning for contents */

      }

      table {
        /* width: 70%; */
        border-collapse: collapse; /* Merges cell borders */
        font-family: sans-serif;
      }

      th, td {
        padding: 7px 7px;
        border: 0.5px solid #ddd;
        font-size: 11px;
      }

      th {
        background-color: #007bff;
        color: white;
        cursor: pointer; /* Shows user the header is clickable */
        user-select: none;
      }

      th:hover {
        background-color: #0056b3;
      }

      /* Zebra striping for readability */
      tbody tr:nth-child(even) {
        background-color: #f2f2f2;
      }
