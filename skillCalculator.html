  <meta charset="UTF-8">

  <style>

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    .content {
      padding-top: 10px;
      margin: 0 110px;
    }

    .floating-navbar {
      position: fixed;
      top: 10px;
      left: 5px;
      z-index: 1000;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 5px;
      box-sizing: border-box;
    }

    .nav-links iframe {
      width: 100px;
      height: 200px;
      border: none;
    }

    table {
      border-collapse: collapse;
      border-radius: 12px;
      font-family: sans-serif;
    }

    .toolFrame {
      vertical-align: top;
    }
    
    /* Navigation Section Start */
    .sectionNav {
      background-color: rgb(41, 82, 82);
      color: white;
      font-size: 10px;
      table-layout: fixed;
      border-radius: 12px;
      width: 600px;
      height: 230px;
    }

    .header {
      color: rgb(0, 255, 255);
      text-decoration: underline;
      padding: 1px 10px;
      border: 3px;
      border-color: rgb(41, 82, 82);
      border-style: solid;
      text-align: center;
    }

    .link {
      padding: 1px 10px;
      border: 3px;
      border-color: rgb(41, 82, 82);
      border-style: solid;
      cursor: pointer;
      text-align: center;
    }

    .linkH {
      padding: 1px 10px;
      background-color: rgb(177, 157, 41);
      border: 3px;
      border-color: rgb(41, 82, 82);
      border-style: solid;
      cursor: pointer;
      text-align: center;
    }
    /* Navigation Section End */

    /* Points Section Start */
    .pointsDisp {
      background-color: rgb(41, 82, 82);
      color: white;
      font-size: 10px;
      text-align: center;
      table-layout: fixed;
      border-radius: 12px;
      width: 507px;
      height: 60px;
    }

    .point {
      background-color: rgb(41, 82, 82);
      color: rgb(0, 255, 0);
      font-size: 17px;
      font-weight: bold;
    }

    .author {
      background-color: rgb(41, 82, 82);
      color: rgb(55, 117, 117);
      font-size: 17px;
      font-weight: bold;
      text-align: right;
    }

    .green-pts {
      background-color: rgb(41, 82, 82);
      color: rgb(0, 255, 0);
      font-size: 17px;
      font-weight: bold;
      text-align: left;
      
    }

    .yellow-pts {
      background-color: rgb(41, 82, 82);
      color: rgb(255, 255, 0);
      font-size: 17px;
      font-weight: bold;
      text-align: left;
    }

    .red-pts {
      background-color: rgb(41, 82, 82);
      color: rgb(255, 0, 0);
      font-size: 17px;
      font-weight: bold;
      text-align: left;
    }

    .chart-container {
      width: 100%;
      font-family: sans-serif;
      margin: 7px 0;
    }

    .bar-background {
      height: 15px;
      background-color: rgb(60, 113, 117);
      border-radius: 10px;
      overflow: hidden;
    }

    #bar-fill {
      height: 100%;
      width: 0%;
      background-color: rgb(177, 157, 41);
    }
    /* Points Section End */

    /* Tree View Section Start */
    .treeNavDisp {
      background-color: rgb(41, 82, 82);
      color: white;
      font-size: 10px;
      text-align: center;
      table-layout: fixed;
      border-radius: 12px;
      width: 600px;
      height: 438px;
    }

    .treeRow {
      height: 35px;
      text-align: center;
    }

    .navRow {
      font-size: 10px;
      height: 13px;
      text-align: center;
      color: rgb(0, 255, 255);
    }

    .spacerS {
      height: 3px;
    }

    .spacerB {
      height: 9px;
    }

    .sCell {
      width: 2px;
    }

    .lCell {
      width: 31px;
    }

    .treeCell {
      background-color: rgb(60, 113, 117);
      border: 0.5px solid #000000;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      width: 100%;
      height: 35px;
      cursor: pointer;
      border-bottom-left-radius: 8px;
      border-top-right-radius: 8px;
    }

    .treeCellH {
      background-color: rgb(177, 157, 41);
      border: 0.5px solid #000000;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      width: 100%;
      height: 35px;
      cursor: pointer;
      border-bottom-left-radius: 8px;
      border-top-right-radius: 8px;
    }

    .treeTitle {
      color: rgb(255, 255, 0);
      font-size: 17px;
    }

    .treeName {
      margin: 0;
    }

    .treePoints {
      position: absolute;
      color: rgb(255, 255, 0);
      bottom: 1px;
      right: 3px;
      margin: 0;
    }
    /* Tree View Section End */

    /* Details Section Start */
    .detailsDisp {
      background-color: rgb(41, 82, 82);
      color: white;
      font-size: 11px;
      table-layout: fixed;
      width: 504px;
      height: 600px;/**/
      overflow-x: auto;
      overflow-y: auto;
    }

    .detHeader {
      background-color: rgb(41, 82, 82);
      color: rgb(255, 255, 0);
      font-size: 17px;
      text-align: center;
    }

    .detTitle {
      background-color: rgb(41, 82, 82);
      color: rgb(0, 255, 0);
      font-size: 13px;
      text-align: center;
    }

    .detGroup {
      font-size: 12px;
      color: rgb(255, 255, 0);
      text-align: center;
    }

    .detCell {
      font-size: 11px;
      padding: 1px 8px;
      width: 243px
    }

    .xpCell {
      font-size: 11px;
      padding: 1px 8px;
    }

    .dscCell {
      font-size: 11px;
      color: rgb(0, 255, 255);
      padding: 1px 15px 5px 15px;
    }
    /* Details Section End */

  </style>

      </table>

      });
      skill_id.addEventListener('mouseleave', () => {
              const url = new URL(window.location.href);
              window.location.href = url;
      });
    
    });

    document.querySelector('#skillDetails tbody').innerHTML = '';
    const detailTableBody=document.querySelector("#skillDetails tbody");
    const detRow=document.createElement('tr');
    const detailTable=document.createElement('td');
      detailTable.className="outer-shell";

    let schematics = [];
    let abilities = [];
    let certifications = [];
    let titles = [];
    let deeds = [];
    let sklMods = aSkillModifiers;
      sklMods = sklMods.map(id => ({
        id,
        value: 0
      }));
    let experiences = aExperience;
      experiences = experiences.map(id => ({
        id,
        value: 0
      }));
      
    allProfessions.forEach(p => {
      p.skills.forEach(s => {

        if(s.SkillMods !== null){
          aSkillModifiers.forEach(m => {
            if(skillsObject[p.professionId] & s.bitValue && s.SkillMods[0][m]){
              let modVal = sklMods.find(mod => mod.id === m).value
                  modVal = modVal + s.SkillMods[0][m];
              sklMods = sklMods.map(mod => {
                if (mod.id === m) {
                  return {...mod, value: modVal };
                }
                return mod;
              })
            }
          })
        };

        if(s.Requires !== null){
          aExperience.forEach(xpType => {
            if(skillsObject[p.professionId] & s.bitValue && s.Requires[0][xpType]){
              let xpVal = experiences.find(xp => xp.id === xpType).value
                  xpVal = xpVal + s.Requires[0][xpType];
              experiences = experiences.map(xp => {
                if (xp.id === xpType) {
                  return {...xp, value: xpVal };
                }
                return xp;
              })
            }
          })
        };

        if(s.Abilities !== null){aAbilities.forEach(a => {if(skillsObject[p.professionId] & s.bitValue && s.Abilities[0][a]){abilities = [...new Set([...abilities, a])]}})};

        if(skillsObject[p.professionId] & s.bitValue && s.Certifications !== null){certifications = [...new Set([...certifications, ...s.Certifications])]};

        if(skillsObject[p.professionId] & s.bitValue && s.Schematics !== null){schematics = [...new Set([...schematics, ...s.Schematics])]};

        if(skillsObject[p.professionId] & s.bitValue && s.Title !== null){titles.push(s.Title)};

        if(skillsObject[p.professionId] & s.bitValue && s.Deeds !== null){deeds = [...new Set([...deeds, ...s.Deeds])]};

      })
    });

    sklMods.sort((a, b) => a.id.localeCompare(b.id));
    schematics.sort((a, b) => a.localeCompare(b));
    certifications.sort((a, b) => a.localeCompare(b));
    abilities.sort((a, b) => a.localeCompare(b));
    titles.sort((a, b) => a.localeCompare(b));
    deeds.sort((a, b) => a.localeCompare(b));
    experiences.sort((a, b) => a.id.localeCompare(b.id));
    experiences.sort((a, b) => b.value - a.value);

    let tblS = '<table border="0" width="480px"><tr><td colspan= "2" class="detHeader">Accumulated Skill Data</td></tr>';

    const xps = experiences.filter(xp => xp.value !== 0);
    
    let xpHTML = '';
    if(xps[0]){
      xpHTML = xpHTML + '<tr><td colspan= "2" class="detGroup"><hr style="border: 0; border-bottom: 2px solid #00ffff;">Experience Required<br><br></td></tr>';
      xpHTML = xpHTML + '<tr><td colspan= "2"><table>';
      for (let i = 0; i < xps.length;) {
        xpHTML = xpHTML + '<tr><td class="xpCell" style="text-align: right;">' + xps[i].value.toLocaleString('en-US') + '</td><td class="xpCell">' + xps[i].id + '</td></tr>';
        i++
      };
      xpHTML = xpHTML + '</table></td></tr>';
    };

    const mods = sklMods.filter(mod => mod.value !== 0);

    const modsMid = Math.ceil(mods.length / 2);
    const modsL = mods.slice(0,modsMid);
    const modsR = mods.slice(modsMid);
    
    let modsHTML = '';
    if(modsL[0]){
      modsHTML = modsHTML + '<tr><td colspan= "2" class="detGroup"><hr style="border: 0; border-bottom: 2px solid #00ffff;">SkillMods<br><br></td></tr>';
      for (let i = 0; i < modsL.length;) {
        modsHTML = modsHTML + '<tr><td class="detCell">' + modsL[i].id + ' +' + modsL[i].value + '</td>';
        
        if(modsR[i]){modsHTML = modsHTML + '<td class="detCell">' + modsR[i].id + ' +' + modsR[i].value.toLocaleString('en-US') + '</td></tr>'};
        i++
      };
    };

    const abilitiesMid = Math.ceil(abilities.length / 2);
    const abilitiesL = abilities.slice(0,abilitiesMid);
    const abilitiesR = abilities.slice(abilitiesMid);

    let abilitiesHTML = '';
    if(abilities[0]){
      abilitiesHTML = abilitiesHTML + '<tr><td colspan= "2" class="detGroup"><hr style="border: 0; border-bottom: 2px solid #00ffff;">Abilities<br><br></td></tr>';
      for (let i = 0; i < abilitiesL.length;) {
        abilitiesHTML = abilitiesHTML + '<tr><td class="detCell">' + abilitiesL[i] + '</td>';
        
        if(abilitiesR[i]){abilitiesHTML = abilitiesHTML + '<td class="detCell">' + abilitiesR[i] + '</td></tr>'};
        i++
      };
    };

    const titlesMid = Math.ceil(titles.length / 2);
    const titlesL = titles.slice(0,titlesMid);
    const titlesR = titles.slice(titlesMid);

    let titlesHTML = '';
    if(titles[0]){
      titlesHTML = titlesHTML + '<tr><td colspan= "2" class="detGroup"><hr style="border: 0; border-bottom: 2px solid #00ffff;">Titles<br><br></td></tr>';
      for (let i = 0; i < titlesL.length;) {
        titlesHTML = titlesHTML + '<tr><td class="detCell">' + titlesL[i] + '</td>';
        
        if(titlesR[i]){titlesHTML = titlesHTML + '<td class="detCell">' + titlesR[i] + '</td></tr>'};
        i++
      };
    };

    const certificationsMid = Math.ceil(certifications.length / 2);
    const certificationsL = certifications.slice(0,certificationsMid);
    const certificationsR = certifications.slice(certificationsMid);

    let certificationsHTML = '';
    if(certifications[0]){
      certificationsHTML = certificationsHTML + '<tr><td colspan= "2" class="detGroup"><hr style="border: 0; border-bottom: 2px solid #00ffff;">Certifications<br><br></td></tr>';
      for (let i = 0; i < certificationsL.length;) {
        certificationsHTML = certificationsHTML + '<tr><td class="detCell">' + certificationsL[i] + '</td>';
        
        if(certificationsR[i]){certificationsHTML = certificationsHTML + '<td class="detCell">' + certificationsR[i] + '</td></tr>'};
        i++
      };
    };

    const schematicsMid = Math.ceil(schematics.length / 2);
    const schematicsL = schematics.slice(0,schematicsMid);
    const schematicsR = schematics.slice(schematicsMid);

    let schematicsHTML = '';
    if(schematics[0]){
      schematicsHTML = schematicsHTML + '<tr><td colspan= "2" class="detGroup"><hr style="border: 0; border-bottom: 2px solid #00ffff;">Schematics<br><br></td></tr>';
      for (let i = 0; i < schematicsL.length;) {
        schematicsHTML = schematicsHTML + '<tr><td class="detCell">' + schematicsL[i] + '</td>';
        
        if(schematicsR[i]){schematicsHTML = schematicsHTML + '<td class="detCell">' + schematicsR[i] + '</td></tr>'};
        i++
      };
    };

    const deedsMid = Math.ceil(deeds.length / 2);
    const deedsL = deeds.slice(0,deedsMid);
    const deedsR = deeds.slice(deedsMid);

    let deedsHTML = '';
    if(deeds[0]){
      deedsHTML = deedsHTML + '<tr><td colspan= "2" class="detGroup"><hr style="border: 0; border-bottom: 2px solid #00ffff;">Deeds<br><br></td></tr>';
      for (let i = 0; i < deedsL.length;) {
        deedsHTML = deedsHTML + '<tr><td class="detCell">' + deedsL[i] + '</td>';
        
        if(deedsR[i]){deedsHTML = deedsHTML + '<td class="detCell">' + deedsR[i] + '</td></tr>'};
        i++
      };
    };
    
    let tblE = '</table>';

    detailTable.innerHTML = tblS + xpHTML + modsHTML + abilitiesHTML + titlesHTML + certificationsHTML + schematicsHTML + deedsHTML + tblE;
    detRow.appendChild(detailTable);
    detailTableBody.append(detRow);

  };
});

const tblSkills = document.getElementById('professionsTree');
tblSkills.addEventListener('click', function(event) {
  // Target the specific element that was clicked
  const targetCell = event.target;
  const targetString = targetCell.innerHTML;
  const clckS = targetString.indexOf("<br");
  const idClicked = targetString.slice(clckS+4,clckS+6).replace("=","");
  const selClicked = targetString.slice(clckS+6,clckS+17).replace("=","").replace('"','').replace('"','').replace('>','');



  let aBV = aProfessions;
    aBV = aBV.map(total => ({
      ...total,
      value: 0
    }));

  for (let i = 0; i < allProfessions.length; i++) {
    aBV = aBV.map(prof => 
      prof.professionId === allProfessions[i].professionId ? { ...prof, value: skillsObject[(allProfessions[i].professionId)] } : prof
    );
  };

  currentUrl = window.location.href;
  pUrl = currentUrl.substring(currentUrl.indexOf('skills=')+7);
  pProf = pUrl.slice(0,2);
  pProfId = Number(pUrl.slice(0,2));

  if(selClicked === "treeCell"){
    for (let q = 0; q < allProfessions[pProfId].skills[idClicked].qualifies.length; q++) {
      for (let p = 0; p < aProfessions.length; p++) {
        if(allProfessions[pProfId].skills[idClicked].qualifies[q][(aProfessions[p].professionId)] > 0){
          aBV = aBV.map(prof => {
            if (prof.professionId === aProfessions[p].professionId) {
              return { ...prof, value: prof.value | (skillsObject[(aProfessions[p].professionId)] ?? 0) | (allProfessions[pProfId].skills[idClicked].qualifies[q][(aProfessions[p].professionId)] ?? 0) };
            }
            return prof;
          });
        };
      };
    };
  };

  if(selClicked === "treeCellH"){
    for (let q = 0; q < allProfessions[pProfId].skills[idClicked].disqualifies.length; q++) {
      for (let p = 0; p < aProfessions.length; p++) {
        if(allProfessions[pProfId].skills[idClicked].disqualifies[q][(aProfessions[p].professionId)] > 0){
          aBV = aBV.map(prof => {
            if (prof.professionId === aProfessions[p].professionId) {
              return { ...prof, value: (prof.value | (skillsObject[(aProfessions[p].professionId)] ?? 0) | (allProfessions[pProfId].skills[idClicked].disqualifies[q][(aProfessions[p].professionId)] ?? 0)) - (allProfessions[pProfId].skills[idClicked].disqualifies[q][(aProfessions[p].professionId)] ?? 0) };
            }
            return prof;
          });
        };
      };
    };
  };

  let skillsParam = pProf + '-';
  aBV.forEach(profBit => {
    if(profBit.value > 0){
      skillsParam = skillsParam + profBit.professionId + '-' + profBit.value + '-';
    }
  })
  
  skillsParam = skillsParam.slice(0,-1)

  const url = new URL(window.location.href);
  url.searchParams.set('skills', skillsParam);
  window.history.replaceState(null, '', url);
  window.location.href = url;

});

window.onload = function() {
    
    const clckName = "link-"+pProf;
    const textElement = document.getElementById(clckName);
    
    if (textElement) {
        textElement.click();
    }
};

</script>
