<!DOCTYPE html>
<html>
<head>
    <title>Coding Examples</title>
</head>

<style>
    body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background-color: #f5f7fa;
    }

    .floating-navbar {
    position: fixed;
    top: 10px;
    left: 5px;
    /*width: 90%;
    max-width: 1200px;*/
    z-index: 1000;
    
    /* Flexbox positioning for contents */
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0 5px;
    box-sizing: border-box;
    }

    .nav-links iframe {
        width: 100px;
        height: 200px;
        border: none;
    }

    .content {
    padding-top: 10px; 
    /*max-width: 800px;*/
    margin: 0 110px;
    }

</style>

<nav class="floating-navbar">
  <div class="nav-links">
    <iframe src="links.html" scrolling="no"></iframe>
  </div>
</nav>

<main class="content">
  <h1>Scroll Down</h1>
  <p>The menu bar will remain locked at the top of the viewport.</p>

</main>

</html>
